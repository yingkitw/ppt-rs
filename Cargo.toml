[package]
name = "ppt-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ying Kit WONG"]
description = "Create, read, and update PowerPoint 2007+ (.pptx) files with rich formatting, bullet styles, themes, and templates."
license = "Apache-2.0"
repository = "https://github.com/yingkitw/ppt-rs"
keywords = ["powerpoint", "ppt", "pptx", "openxml", "office"]
categories = ["text-processing", "parser-implementations"]
readme = "README.md"

[dependencies]
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
xml-rs = "0.8"
uuid = { version = "1.24", features = ["v4"] }
thiserror = "2.0"

# CLI dependencies (optional)
clap = { version = "4.6", features = ["derive"], optional = true }
pulldown-cmark = { version = "0.13", optional = true }

# Syntax highlighting (optional)
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "default-syntaxes", "default-themes"], optional = true }

# Network dependencies (optional)
reqwest = { version = "0.11", default-features = false, features = ["blocking", "default-tls"], optional = true }
scraper = { version = "0.27", optional = true }

# PDF export without LibreOffice (optional)
pdfrs = { version = "0.1", default-features = false, optional = true }

# Web-to-Markdown bridge (optional)
web2md = { version = "0.1", default-features = false, optional = true }

# MCP dependencies (optional)
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rmcp = { version = "2.2", features = ["transport-io", "server", "macros"], optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net"], optional = true }
axum = { version = "0.7", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["pdf-native"]
cli = ["clap", "pulldown-cmark", "syntect", "pdf-native"]
mcp = ["serde", "serde_json", "dep:rmcp", "dep:tokio", "cli"]
http = ["serde", "serde_json", "dep:tokio", "dep:axum", "dep:base64", "cli"]
web2ppt = ["reqwest", "scraper"]
web2md = ["dep:web2md", "web2ppt", "cli"]
pdf-native = ["dep:pdfrs"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"
serde_json = "1"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "pptx_benchmarks"
harness = false

[lib]
name = "ppt_rs"
path = "src/lib.rs"

[[bin]]
name = "pptcli"
path = "src/bin/pptcli.rs"
required-features = ["cli"]

[[bin]]
name = "ppt_mcp"
path = "src/bin/ppt_mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "ppt_http"
path = "src/bin/ppt_http.rs"
required-features = ["http"]

[[test]]
name = "mcp_integration_test"
path = "tests/mcp_integration_test.rs"
required-features = ["mcp"]

[[test]]
name = "http_test"
path = "tests/http_test.rs"
required-features = ["http"]

[[example]]
name = "enhanced_markdown_features"
path = "examples/enhanced_markdown_features.rs"
required-features = ["cli"]

[[example]]
name = "batch_generator"
path = "examples/batch_generator.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = true
strip = true
